name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # EnableWindowsTargeting lets the net8.0-windows target build here too, so the
      # shipping configuration is compiled on every push rather than only on Windows.
      - name: Build
        run: dotnet build OpenBaseCamp.sln -c Release

      - name: Test
        run: dotnet test tests/OpenBaseCamp.Core.Tests/OpenBaseCamp.Core.Tests.csproj -c Release --no-build

      - name: Render UI screenshots
        run: dotnet run --project tools/OpenBaseCamp.UiPreview -c Release --no-build -- artifacts/ui

      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: artifacts/ui
